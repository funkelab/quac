data:
  source: images
classifier:
  checkpoint: classifier.pt

# Small networks and a short run keep this demonstration inexpensive.
generator:
  base_channels: 8
  max_channels: 32
  mapping_width: 32
training:
  steps: 5000
  batch_size: 16
  log_every: 10
explanation:
  methods: [DIntegratedGradients, residual]
  samples: 2
  levels: 21
  integration_steps: 16
summary:
  top_k: 3

output:
  overwrite: true
