data:
  source: images
  # validation: validation  # same class subdirectories as source
  # check_shapes: false  # skip the startup shape check for known-consistent data
classifier:
  checkpoint: classifier.pt

# Small networks and a short run keep this demonstration inexpensive.
generator:
  base_channels: 8
  max_channels: 32
  mapping_width: 32
training:
  steps: 5000
  batch_size: 16
  log_every: 10
  # num_workers: 4  # parallel image loading processes
  # validate_every: 500
  # validation_samples: 128  # per class, for classifier translation metrics
explanation:
  methods: [DIntegratedGradients, residual]
  samples: 2
  levels: 21
  integration_steps: 16
summary:
  top_k: 3

output:
  overwrite: true

# Requires: pip install 'quac[wandb]'
# wandb:
#   enabled: true
#   project: quac
#   mode: online
