<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuAC Visualizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="d-flex vh-100">
        <!-- Collapsible Sidebar -->
        <div class="bg-light d-flex flex-column" id="sidebar" style="width: 300px; overflow-y: auto; padding: 1rem; transition: transform 0.3s ease-in-out, width 0.3s ease-in-out;">
            <h5 class="mb-2">QuAC Visualizer</h5>
                <div id="report-info" class="mb-2">
                    <h6 class="mb-1">Report Info</h6>
                    <div id="report-details" class="small">Loading...</div>
                </div>

                <div class="mb-2">
                    <h6>QuAC Curve</h6>
                    <canvas id="quac-curve"></canvas>
                </div>

                <div class="mb-2">
                    <h6>Filters</h6>
                    <form id="filter-form">
                        <div class="mb-2">
                            <label for="source-class" class="form-label small">Source Class</label>
                            <select class="form-select form-select-sm" id="source-class" name="source_class">
                                <option value="">All</option>
                            </select>
                        </div>
                        
                        <div class="mb-2">
                            <label for="target-class" class="form-label small">Target Class</label>
                            <select class="form-select form-select-sm" id="target-class" name="target_class">
                                <option value="">All</option>
                            </select>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small">QuAC Score Range</label>
                            <div class="dual-range-container" style="position: relative; height: 40px; margin: 10px 0;">
                                <!-- Background track -->
                                <div class="dual-track" style="position: absolute; top: 18px; height: 4px; background: #dee2e6; width: 100%; border-radius: 2px;"></div>
                                <!-- Active range -->
                                <div class="dual-range" id="dual-range" style="position: absolute; top: 18px; height: 4px; background: var(--primary-color); border-radius: 2px; left: 0%; width: 100%;"></div>
                                <!-- Min thumb -->
                                <div class="dual-thumb dual-thumb-min" id="min-thumb" style="position: absolute; top: 10px; left: 0%; width: 20px; height: 20px; background: var(--primary-color); border-radius: 50%; cursor: pointer; margin-left: -10px; z-index: 2;"></div>
                                <!-- Max thumb -->
                                <div class="dual-thumb dual-thumb-max" id="max-thumb" style="position: absolute; top: 10px; left: 100%; width: 20px; height: 20px; background: var(--primary-color); border-radius: 50%; cursor: pointer; margin-left: -10px; z-index: 3;"></div>
                                <!-- Hidden inputs for form submission -->
                                <input type="hidden" id="min-score" name="min_score" value="0">
                                <input type="hidden" id="max-score" name="max_score" value="1">
                            </div>
                            <div class="d-flex justify-content-between mt-1">
                                <small>Min: <span id="min-score-value">0.00</span></small>
                                <small>Max: <span id="max-score-value">1.00</span></small>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-sm w-100 mb-1">Apply Filters</button>
                        <button type="button" id="reset-filters" class="btn btn-outline-secondary btn-sm w-100">Reset Filters</button>
                    </form>
                </div>

                <div class="mt-auto">
                    <h6>Downloads</h6>
                    <button id="download-json" class="btn btn-outline-secondary btn-sm w-100 mb-1">Download JSON</button>
                    <button id="download-images" class="btn btn-outline-secondary btn-sm w-100">Download Images</button>
                </div>
            </div>

        <!-- Collapsed sidebar indicator -->
        <div id="sidebar-collapsed" class="bg-light d-flex align-items-center justify-content-center" style="width: 40px; height: 100vh; cursor: pointer; display: none; writing-mode: vertical-rl; text-orientation: mixed; font-weight: bold; color: #6c5ce7;">
            QuAC
        </div>

        <!-- Sidebar resizer -->
        <div id="sidebar-divider" class="resizer" style="width: 4px; background: #dee2e6; cursor: col-resize; border-left: 1px solid #adb5bd; border-right: 1px solid #adb5bd;"></div>

        <!-- Main content area -->
        <div class="container-fluid flex-grow-1" id="main-content">
        <div class="row h-100">
                <div class="d-flex h-100">
                    <!-- Explanation list -->
                    <div id="explanations-pane" class="d-flex flex-column h-100" style="width: 33%; min-width: 200px;">
                        <div class="d-flex justify-content-between align-items-center mb-3" style="padding: 0.5rem;">
                            <h5>Explanations</h5>
                            <span id="explanation-count" class="badge bg-secondary">0</span>
                        </div>
                        <div class="flex-grow-1 d-flex flex-column" style="min-height: 0; padding: 0 0.5rem;">
                            <div id="explanation-list" class="list-group flex-grow-1" style="overflow-y: auto; min-height: 0;">
                                <!-- Explanations will be populated here -->
                            </div>
                            <div id="load-more-container" class="text-center mt-2 flex-shrink-0">
                                <button id="load-more" class="btn btn-outline-primary btn-sm">Load More</button>
                            </div>
                        </div>
                    </div>

                    <!-- Resizable divider -->
                    <div id="divider" class="resizer" style="width: 4px; background: #dee2e6; cursor: col-resize; user-select: none; border-left: 1px solid #adb5bd; border-right: 1px solid #adb5bd;"></div>

                    <!-- Image viewer -->
                    <div id="image-viewer-pane" class="h-100 flex-grow-1" style="min-width: 300px; padding: 0.5rem; overflow-y: auto;">
                        <div id="image-viewer" class="h-100 d-flex flex-column" style="display: none;">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 id="viewer-title">Explanation Details</h5>
                                <div>
                                    <button id="close-viewer" class="btn btn-sm btn-outline-secondary">×</button>
                                </div>
                            </div>

                            <!-- Explanation metadata -->
                            <div class="row mb-3">
                                <div class="col-md-12">
                                    <div class="card">
                                        <div class="card-body">
                                            <div class="row">
                                                <div class="col-md-3">
                                                    <strong>Score:</strong> <span id="exp-score" class="badge bg-primary"></span>
                                                </div>
                                                <div class="col-md-3">
                                                    <strong>Source:</strong> <span id="exp-source-class"></span>
                                                </div>
                                                <div class="col-md-3">
                                                    <strong>Target:</strong> <span id="exp-target-class"></span>
                                                </div>
                                                <div class="col-md-3">
                                                    <strong>Method:</strong> <span id="exp-method"></span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Image controls -->
                            <div class="row mb-3">
                                <div class="col-md-12">
                                    <div class="btn-group w-100" role="group">
                                        <input type="radio" class="btn-check" name="image-toggle" id="show-query" autocomplete="off" checked>
                                        <label class="btn btn-outline-primary" for="show-query">Query Image</label>
                                        
                                        <input type="radio" class="btn-check" name="image-toggle" id="show-counterfactual" autocomplete="off">
                                        <label class="btn btn-outline-primary" for="show-counterfactual">Counterfactual Image</label>
                                    </div>
                                    
                                    <div class="mt-2 d-flex align-items-center">
                                        <label for="mask-opacity" class="form-label small me-2 mb-0">Mask Opacity</label>
                                        <input type="range" class="form-range flex-grow-1" id="mask-opacity" min="0" max="100" step="5" value="0">
                                        <span id="mask-opacity-value" style="display: none;">0%</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Image display area with annotation -->
                            <div class="row justify-content-center">
                                <div class="col-md-7">
                                    <div class="position-relative d-flex justify-content-center">
                                        <div id="image-container" style="position: relative; display: inline-block;">
                                            <img id="main-image" src="" alt="Explanation Image" style="max-width: 100%; height: auto; border: 1px solid #ddd;">
                                            <canvas id="mask-overlay" style="position: absolute; top: 0; left: 0; pointer-events: none; display: none;"></canvas>
                                        </div>
                                    </div>
                                    <div class="text-center mt-2">
                                        <small id="image-info" class="text-muted"></small>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="h-100 d-flex flex-column">
                                        <textarea 
                                            id="explanation-annotation" 
                                            class="form-control flex-grow-1" 
                                            placeholder="Add your notes about this explanation..."
                                            rows="10"
                                            style="resize: vertical; min-height: 200px;">
                                        </textarea>
                                        <small class="text-muted mt-1">
                                            <span id="annotation-status" class="text-success" style="display: none;">✓ Saved</span>
                                        </small>
                                    </div>
                                </div>
                            </div>

                            <!-- QuAC curve for this explanation -->
                            <div class="row mt-4 flex-grow-1" style="min-height: 0;">
                                <div class="col-md-12 d-flex flex-column" style="min-height: 0;">
                                    <h6>Individual QuAC Curve</h6>
                                    <div class="flex-grow-1" style="min-height: 200px; position: relative;">
                                        <canvas id="individual-curve"></canvas>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Placeholder when no explanation is selected -->
                        <div id="no-explanation" class="d-flex align-items-center justify-content-center h-100 text-center text-muted">
                            <div>
                                <h5>Please select an explanation</h5>
                                <p>Click on an explanation from the list to view details</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading overlay -->
    <div id="loading-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999;">
        <div class="d-flex justify-content-center align-items-center h-100">
            <div class="spinner-border text-light" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
